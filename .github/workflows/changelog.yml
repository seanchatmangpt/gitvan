name: Generate Changelog

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version label for the generated changelog artifact
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate deterministic changelog artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Resolve admitted changelog identity
        id: identity
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(node -p 'require("./package.json").version')"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version label: $VERSION" >&2
            exit 1
          fi
          SUBJECT_DATE="$(git show -s --format=%cs "$GITHUB_SHA")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "subject_date=$SUBJECT_DATE" >> "$GITHUB_OUTPUT"
      - name: Generate proposed changelog without repository mutation
        shell: bash
        run: |
          VERSION='${{ steps.identity.outputs.version }}'
          SUBJECT_DATE='${{ steps.identity.outputs.subject_date }}'
          LATEST_TAG="$(git describe --tags --abbrev=0 "$GITHUB_SHA" 2>/dev/null || true)"
          {
            echo '# Changelog'
            echo
            echo 'All notable changes to this project will be documented in this file.'
            echo
            echo "## [$VERSION] - $SUBJECT_DATE"
            echo
            if [[ -n "$LATEST_TAG" ]]; then
              RANGE="$LATEST_TAG..$GITHUB_SHA"
            else
              RANGE="$GITHUB_SHA"
            fi
            for section in Added Changed Fixed Security Documentation Other; do
              echo "### $section"
              case "$section" in
                Added) pattern='^(feat|add|new)(\([^)]*\))?!?:' ;;
                Changed) pattern='^(update|change|refactor|improve|perf)(\([^)]*\))?!?:' ;;
                Fixed) pattern='^(fix|bugfix|patch)(\([^)]*\))?!?:' ;;
                Security) pattern='^(security|sec)(\([^)]*\))?!?:' ;;
                Documentation) pattern='^(docs|doc)(\([^)]*\))?!?:' ;;
                Other) pattern='.*' ;;
              esac
              git log "$RANGE" --pretty=format:'%s' --no-merges | while IFS= read -r subject; do
                matched=false
                if [[ "$subject" =~ $pattern ]]; then matched=true; fi
                if [[ "$section" == Other ]]; then
                  if [[ "$subject" =~ ^(feat|add|new|update|change|refactor|improve|perf|fix|bugfix|patch|security|sec|docs|doc)(\([^)]*\))?!?: ]]; then
                    matched=false
                  fi
                fi
                if [[ "$matched" == true ]]; then printf -- '- %s\n' "$subject"; fi
              done
              echo
            done
            if [[ -f CHANGELOG.md ]]; then
              echo '---'
              echo
              tail -n +2 CHANGELOG.md
            fi
          } > CHANGELOG.generated.md
          git diff --exit-code -- CHANGELOG.md
      - name: Bind changelog receipt
        run: |
          sha256sum CHANGELOG.generated.md > CHANGELOG.generated.sha256
          printf '%s\n' "$GITHUB_SHA" > SOURCE_SHA
      - name: Upload proposed changelog
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: changelog-${{ github.sha }}
          path: |
            CHANGELOG.generated.md
            CHANGELOG.generated.sha256
            SOURCE_SHA
          if-no-files-found: error
          retention-days: 30
