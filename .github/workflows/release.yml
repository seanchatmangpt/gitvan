name: Release and Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: UTC
  LANG: C
  NODE_ENV: production

jobs:
  manufacture:
    name: Manufacture release capsule
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact release subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin pnpm toolchain
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.21.0
          test "$(pnpm --version)" = "11.21.0"
      - name: Admit release identity
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            test "$TAG_VERSION" = "$PACKAGE_VERSION" || {
              echo "Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION" >&2
              exit 1
            }
          fi
          printf '%s\n' "$PACKAGE_VERSION" > /tmp/gitvan-release-version
          printf '%s\n' "$GITHUB_SHA" > /tmp/gitvan-release-subject
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Enterprise actuation contract
        run: pnpm test:enterprise
      - name: Lint
        run: pnpm lint
      - name: Full regression suite
        run: pnpm test
      - name: Documentation contract
        run: pnpm test:docs
      - name: Build
        run: pnpm build
      - name: High-severity production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Manufacture exact npm artifact
        run: |
          rm -rf /tmp/gitvan-release
          mkdir -p /tmp/gitvan-release
          pnpm pack --pack-destination /tmp/gitvan-release
          TARBALL="$(find /tmp/gitvan-release -maxdepth 1 -type f -name 'gitvan-*.tgz' -print -quit)"
          test -n "$TARBALL"
          sha256sum "$TARBALL" > /tmp/gitvan-release/SHA256SUMS
          cp /tmp/gitvan-release-version /tmp/gitvan-release/VERSION
          cp /tmp/gitvan-release-subject /tmp/gitvan-release/SOURCE_SHA
      - name: Consumer smoke test exact artifact
        run: |
          TARBALL="$(find /tmp/gitvan-release -maxdepth 1 -type f -name 'gitvan-*.tgz' -print -quit)"
          rm -rf /tmp/gitvan-consumer
          mkdir -p /tmp/gitvan-consumer
          cd /tmp/gitvan-consumer
          npm init -y
          npm install "$TARBALL"
          npx --no-install gitvan --version
          npx --no-install gitvan --help
      - name: Upload release capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitvan-release-${{ github.sha }}
          path: /tmp/gitvan-release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish admitted release
    runs-on: ubuntu-latest
    needs: manufacture
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Set up Node 22 for npm
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download exact release capsule
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gitvan-release-${{ github.sha }}
          path: release/
      - name: Verify release capsule identity
        working-directory: release
        run: |
          test "$(cat SOURCE_SHA)" = "$GITHUB_SHA"
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
          sha256sum --check SHA256SUMS
      - name: Publish the tested tarball
        working-directory: release
        run: |
          TARBALL="$(find . -maxdepth 1 -type f -name 'gitvan-*.tgz' -print -quit)"
          test -n "$TARBALL"
          npm publish "$TARBALL" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify registry consequence
        working-directory: release
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          OBSERVED=''
          for attempt in {1..12}; do
            OBSERVED="$(npm view "gitvan@$VERSION" version 2>/dev/null || true)"
            if [[ "$OBSERVED" == "$VERSION" ]]; then
              break
            fi
            sleep 5
          done
          test "$OBSERVED" = "$VERSION"
          rm -rf /tmp/gitvan-registry-consumer
          mkdir -p /tmp/gitvan-registry-consumer
          cd /tmp/gitvan-registry-consumer
          npm init -y
          npm install "gitvan@$VERSION"
          test "$(node -p 'require("gitvan/package.json").version')" = "$VERSION"
          npx --no-install gitvan --version
          npx --no-install gitvan --help
      - name: Create GitHub release for exact tag
        working-directory: release
        run: |
          TARBALL="$(find . -maxdepth 1 -type f -name 'gitvan-*.tgz' -print -quit)"
          gh release create "$GITHUB_REF_NAME" "$TARBALL" --verify-tag --generate-notes --title "GitVan $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
