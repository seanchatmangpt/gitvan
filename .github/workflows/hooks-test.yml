name: Hooks Integration Tests

on:
  push:
    branches: [main, develop, 'claude/**']
    paths:
      - 'hooks/**'
      - 'src/unrdf-hooks/**'
      - 'src/integrations/unrdf-hooks-bridge.mjs'
      - 'src/jobs/hooks.mjs'
      - 'src/cli/commands/hooks.mjs'
      - 'tests/**/*hooks*.mjs'
      - 'vendor/unrdf/**'
      - '.github/workflows/hooks-test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'hooks/**'
      - 'src/unrdf-hooks/**'
      - 'src/integrations/**'
      - 'tests/**/*hooks*.mjs'
  workflow_dispatch:

env:
  TZ: UTC
  LANG: C
  NODE_ENV: test

jobs:
  # ============================================================================
  # Hooks Integration Tests
  # ============================================================================
  hooks-test:
    name: Hooks Integration Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize and update submodules
        run: |
          git submodule init
          git submodule update --recursive --remote

      - name: Verify unrdf submodule
        run: |
          if [ ! -d "vendor/unrdf" ]; then
            echo "❌ ERROR: vendor/unrdf submodule not found!"
            exit 1
          fi
          echo "✅ vendor/unrdf submodule found"
          ls -la vendor/unrdf/

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node${{ matrix.node-version }}-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node-version }}-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Verify unrdf installation
        run: npm run verify-deps || echo "Verification skipped"
        continue-on-error: true

      - name: Run hooks unit tests
        run: |
          npm test -- tests/knowledge-hooks-simple-verification.test.mjs \
            tests/knowledge-hooks-system.test.mjs \
            tests/jtbd-hooks-structure.test.mjs \
            --reporter=verbose
        continue-on-error: false

      - name: Run hooks integration tests
        run: |
          npm test -- tests/knowledge-hooks-git-lifecycle.test.mjs \
            tests/knowledge-hooks-end-to-end.test.mjs \
            tests/developer-workflow-knowledge-hooks.test.mjs \
            --reporter=verbose
        continue-on-error: false

      - name: Run submodule integration tests
        run: |
          npm test -- tests/submodule-integration.test.mjs \
            tests/unrdf-real-usage.test.mjs \
            --reporter=verbose
        continue-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hooks-test-results-node${{ matrix.node-version }}
          path: |
            test-results.json
            coverage/
          retention-days: 7

  # ============================================================================
  # Hooks Stress Tests
  # ============================================================================
  hooks-stress:
    name: Hooks Stress Tests
    runs-on: ubuntu-latest
    needs: hooks-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize and update submodules
        run: |
          git submodule init
          git submodule update --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-modules-

      - name: Run stress tests
        run: |
          npm test -- tests/knowledge-hooks-stress.test.mjs \
            tests/knowledge-hooks-timer-stress-test.test.mjs \
            --reporter=verbose --testTimeout=120000
        continue-on-error: true

      - name: Upload stress test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hooks-stress-test-results
          path: test-results.json
          retention-days: 30

  # ============================================================================
  # Hooks Coverage Report
  # ============================================================================
  hooks-coverage:
    name: Hooks Test Coverage
    runs-on: ubuntu-latest
    needs: hooks-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize and update submodules
        run: |
          git submodule init
          git submodule update --recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-modules-

      - name: Run hooks tests with coverage
        run: |
          npm test -- tests/**/*hooks*.mjs \
            --coverage \
            --reporter=verbose
        env:
          CI: true

      - name: Check coverage thresholds
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Hooks Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage report found"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage/lcov.info
          flags: hooks
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hooks-coverage-report
          path: coverage/
          retention-days: 30

  # ============================================================================
  # Test Summary
  # ============================================================================
  hooks-test-summary:
    name: Hooks Test Summary
    runs-on: ubuntu-latest
    needs: [hooks-test, hooks-stress, hooks-coverage]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Hooks Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.hooks-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Stress Tests: ${{ needs.hooks-stress.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage: ${{ needs.hooks-coverage.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.hooks-test.result }}" == "failure" ]]; then
            echo "❌ Critical hooks integration tests failed!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [[ "${{ needs.hooks-coverage.result }}" == "failure" ]]; then
            echo "⚠️ Hooks coverage tests failed!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ All critical hooks tests passed!" >> $GITHUB_STEP_SUMMARY

      - name: Create notification comment
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Hooks Integration Tests Failed**\n\nPlease check the test results and fix any failing tests before merging.'
            })
