name: Hooks System Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'hooks/**'
      - 'src/unrdf-hooks/**'
      - 'src/integrations/**'
      - 'src/jobs/hooks.mjs'
      - 'build.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/hooks-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hooks/**'
      - 'src/unrdf-hooks/**'
      - 'src/integrations/**'
      - 'src/jobs/hooks.mjs'
      - 'build.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/hooks-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hooks-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  LANG: C
  NODE_ENV: production

jobs:
  build-hooks:
    name: Build hooks against package-managed UNRDF
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin pnpm toolchain
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.21.0
          test "$(pnpm --version)" = "11.21.0"
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify package-managed UNRDF imports
        run: |
          node --input-type=module <<'NODE'
          const packages = [
            '@unrdf/core',
            '@unrdf/hooks',
            '@unrdf/kgc-4d',
            '@unrdf/kgn',
            '@unrdf/knowledge-engine',
            '@unrdf/streaming',
            '@unrdf/validation',
          ];
          for (const name of packages) {
            await import(name);
            console.log(`ADMITTED ${name}`);
          }
          NODE
      - name: Build package
        run: pnpm build
      - name: Verify hooks build output
        run: |
          test -d dist
          test -f dist/bin/gitvan.mjs
          if grep -R --line-number 'vendor/unrdf' dist; then
            echo 'Built artifact still references removed vendor/unrdf topology' >&2
            exit 1
          fi
      - name: Upload exact hooks build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hooks-build-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
