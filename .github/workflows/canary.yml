name: Canary Deployment

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the admitted artifact to npm with the canary tag
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: UTC
  LANG: C
  NODE_ENV: production

jobs:
  manufacture:
    name: Manufacture canary capsule
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact canary subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin pnpm toolchain
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.21.0
          test "$(pnpm --version)" = "11.21.0"
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Enterprise actuation contract
        run: pnpm test:enterprise
      - name: Lint
        run: pnpm lint
      - name: Full regression suite
        run: pnpm test
      - name: Build canonical source
        run: pnpm build
      - name: High-severity production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Manufacture canary version and package
        shell: bash
        run: |
          BASE_VERSION="$(node -p 'require("./package.json").version')"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          CANARY_VERSION="${BASE_VERSION}-canary.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
          pnpm pkg set version="$CANARY_VERSION"
          rm -rf /tmp/gitvan-canary
          mkdir -p /tmp/gitvan-canary
          pnpm pack --pack-destination /tmp/gitvan-canary
          TARBALL="$(find /tmp/gitvan-canary -maxdepth 1 -type f -name 'gitvan-*.tgz' -print -quit)"
          test -n "$TARBALL"
          printf '%s\n' "$CANARY_VERSION" > /tmp/gitvan-canary/VERSION
          printf '%s\n' "$GITHUB_SHA" > /tmp/gitvan-canary/SOURCE_SHA
          sha256sum "$TARBALL" > /tmp/gitvan-canary/SHA256SUMS
      - name: Consumer smoke test exact canary artifact
        run: |
          TARBALL="$(find /tmp/gitvan-canary -maxdepth 1 -type f -name 'gitvan-*.tgz' -print -quit)"
          rm -rf /tmp/gitvan-canary-consumer
          mkdir -p /tmp/gitvan-canary-consumer
          cd /tmp/gitvan-canary-consumer
          npm init -y
          npm install "$TARBALL"
          npx --no-install gitvan --version
          npx --no-install gitvan --help
      - name: Upload canary capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitvan-canary-${{ github.sha }}
          path: /tmp/gitvan-canary/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish admitted canary
    runs-on: ubuntu-latest
    needs: manufacture
    if: inputs.publish == true
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Set up Node 22 for npm
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download exact canary capsule
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gitvan-canary-${{ github.sha }}
          path: canary/
      - name: Verify canary capsule identity
        working-directory: canary
        run: |
          test "$(cat SOURCE_SHA)" = "$GITHUB_SHA"
          sha256sum --check SHA256SUMS
      - name: Publish the tested canary tarball
        working-directory: canary
        run: |
          TARBALL="$(find . -maxdepth 1 -type f -name 'gitvan-*.tgz' -print -quit)"
          test -n "$TARBALL"
          npm publish "$TARBALL" --tag canary --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
