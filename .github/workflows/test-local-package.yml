name: Local Package Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-local-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin pnpm toolchain
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.21.0
          test "$(pnpm --version)" = "11.21.0"
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Build package
        run: pnpm build
      - name: Manufacture package tarball
        run: |
          rm -rf /tmp/gitvan-pack /tmp/test-package
          mkdir -p /tmp/gitvan-pack /tmp/test-package
          pnpm pack --pack-destination /tmp/gitvan-pack
          PACKAGE_TARBALL="$(find /tmp/gitvan-pack -maxdepth 1 -type f -name 'gitvan-*.tgz' -print -quit)"
          test -n "$PACKAGE_TARBALL"
          cp "$PACKAGE_TARBALL" /tmp/test-package/gitvan.tgz
          sha256sum "$PACKAGE_TARBALL" | tee /tmp/test-package/PACKAGE_SHA256
      - name: Install packaged artifact as a consumer
        working-directory: /tmp/test-package
        run: |
          npm init -y
          npm install ./gitvan.tgz
      - name: Exercise packaged CLI
        working-directory: /tmp/test-package
        run: |
          npx --no-install gitvan --version
          npx --no-install gitvan --help
          git init
          git config user.name "GitVan Package Test"
          git config user.email "gitvan-package-test@example.invalid"
          npx --no-install gitvan init --help
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/gitvan-pack /tmp/test-package
