name: One-shot Fortune-5 closure repair v6

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fortune5-closure-v2.yml'

permissions:
  contents: read

jobs:
  repair:
    if: >-
      github.actor == 'seanchatmangpt' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fortune5-enterprise-hardening-20260812'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - name: Checkout exact admitted branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin pnpm toolchain
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.21.0
          test "$(pnpm --version)" = '11.21.0'
      - name: Apply bounded source and exact direct dependency repair
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} match(es), got {count}: {old!r}')
              p.write_text(text.replace(old, new, expected))

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          deps = package['dependencies']
          dev = package['devDependencies']
          for dead in ['@unrdf/knowledge-engine', '@unrdf/streaming', 'tar']:
              deps.pop(dead, None)
          deps.pop('unbuild', None)
          deps.update({
              '@opentelemetry/api': '1.9.1',
              '@opentelemetry/auto-instrumentations-node': '0.79.0',
              '@opentelemetry/exporter-metrics-otlp-http': '0.221.0',
              '@opentelemetry/exporter-trace-otlp-http': '0.221.0',
              '@opentelemetry/resources': '2.10.0',
              '@opentelemetry/sdk-metrics': '2.10.0',
              '@opentelemetry/sdk-node': '0.221.0',
              '@opentelemetry/sdk-trace-base': '2.10.0',
              '@opentelemetry/semantic-conventions': '1.43.0',
              'defu': '6.1.7',
              'js-yaml': '4.3.1',
              'minimatch': '10.2.6',
              'n3': '2.2.0',
          })
          dev['@types/node'] = '22.20.1'
          dev['unbuild'] = '3.6.1'
          package['dependencies'] = dict(sorted(deps.items()))
          package['devDependencies'] = dict(sorted(dev.items()))
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          replace_exact('src/unrdf-hooks/core/state.ts', "    const newValue = isFunction(setter) ? setter(this.value) : setter;\n", "    const newValue = typeof setter === 'function'\n      ? (setter as (prev: T) => T)(this.value)\n      : setter;\n")
          replace_exact('src/unrdf-hooks/events/hooks.ts', "): AsyncGenerator<T, void, unknown> {\n", "): AsyncIterableIterator<T> {\n")
          replace_exact('src/unrdf-hooks/examples/advanced-patterns.ts', "    return () => subscribers.delete(callback);\n", "    return () => {\n      subscribers.delete(callback);\n    };\n")
          replace_exact('src/unrdf-hooks/repository/hooks.ts', "import { DEFAULT_REPOSITORY_STATE_OPTIONS } from './types.js';\n\nconst execFileAsync = promisify(execFile);\n", "import { DEFAULT_REPOSITORY_STATE_OPTIONS } from './types.js';\n\ntype MutableRemoteInfo = { -readonly [K in keyof RemoteInfo]?: RemoteInfo[K] };\ntype MutableWorktreeInfo = { -readonly [K in keyof WorktreeInfo]?: WorktreeInfo[K] };\n\nconst execFileAsync = promisify(execFile);\n")
          replace_exact('src/unrdf-hooks/repository/hooks.ts', "        const remotes: Map<string, Partial<RemoteInfo>> = new Map();\n", "        const remotes: Map<string, MutableRemoteInfo> = new Map();\n")
          replace_exact('src/unrdf-hooks/repository/hooks.ts', "        let current: Partial<WorktreeInfo> = {};\n", "        let current: MutableWorktreeInfo = {};\n")

          hooks_build = Path('.github/workflows/hooks-build.yml')
          hooks_text = hooks_build.read_text()
          for dead in ["            '@unrdf/knowledge-engine',\n", "            '@unrdf/streaming',\n"]:
              if dead not in hooks_text:
                  raise SystemExit(f'hooks-build missing expected probe: {dead.strip()}')
              hooks_text = hooks_text.replace(dead, '', 1)
          hooks_build.write_text(hooks_text)

          workspace = Path('pnpm-workspace.yaml')
          workspace_text = workspace.read_text()
          workspace_text = workspace_text.replace('protobufjs: 7.5.5', 'protobufjs: 7.6.5')
          workspace_text = workspace_text.replace("'protobufjs@7.5.5': false", "'protobufjs@7.6.5': false")
          workspace_text = workspace_text.replace('patched in protobufjs 7.5.5', 'patched in protobufjs 7.6.5')
          if '  esbuild: 0.28.1\n' not in workspace_text:
              workspace_text = workspace_text.replace('  protobufjs: 7.6.5\n', '  protobufjs: 7.6.5\n  esbuild: 0.28.1\n')
          if "  'esbuild@0.28.1': true\n" not in workspace_text:
              workspace_text = workspace_text.replace("  'esbuild@0.28.2': true\n", "  'esbuild@0.28.2': true\n  'esbuild@0.28.1': true\n")
          workspace.write_text(workspace_text)

          telemetry = Path('src/telemetry/index.mjs')
          telemetry_text = telemetry.read_text()
          telemetry_text = telemetry_text.replace('SEMRESATTRS_SERVICE_NAME', 'ATTR_SERVICE_NAME')
          telemetry_text = telemetry_text.replace('SEMRESATTRS_SERVICE_VERSION', 'ATTR_SERVICE_VERSION')
          telemetry_text = telemetry_text.replace('SEMRESATTRS_DEPLOYMENT_ENVIRONMENT', 'ATTR_DEPLOYMENT_ENVIRONMENT_NAME')
