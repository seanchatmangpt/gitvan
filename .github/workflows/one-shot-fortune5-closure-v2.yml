      - name: Manufacture base lock
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Manufacture patched transitive overrides from audit
        run: pnpm audit --fix=override --prod
      - name: Reconcile generated overrides into canonical lock
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Format manufactured projection
        run: >-
          pnpm exec prettier --write package.json pnpm-workspace.yaml
          src/telemetry/index.mjs src/unrdf-hooks/core/state.ts
          src/unrdf-hooks/events/hooks.ts src/unrdf-hooks/examples/advanced-patterns.ts
          src/unrdf-hooks/repository/hooks.ts .github/workflows/hooks-build.yml
          src/hooks/PredicateEvaluator.mjs src/hooks/HookOrchestrator.mjs
          src/hooks/HookParser.mjs src/workflow/step-handlers/template-step-handler.mjs
          src/composables/git.mjs src/git-native/ReceiptWriter.mjs
          tests/knowledge-hooks-simple-verification.test.mjs
          tests/knowledge-hooks-system.test.mjs
      - name: Replay frozen graph
        run: pnpm install --frozen-lockfile
      - name: Refuse HIGH or CRITICAL production advisories
        run: pnpm audit --prod --audit-level high
      - name: Verify exact direct dependency identities
        run: |
          test "$(node -p 'require("./package.json").dependencies["@opentelemetry/sdk-node"]')" = '0.221.0'
          test "$(node -p 'require("./package.json").dependencies.n3')" = '2.2.0'
          test "$(node -p 'require("./package.json").devDependencies["@types/node"]')" = '22.20.1'
          test "$(node -p 'require("./package.json").devDependencies.unbuild')" = '3.6.1'
      - name: Verify strict hooks type boundary
        run: >-
          pnpm exec tsc --noEmit --skipLibCheck --strict --allowJs false
          --target esnext --module nodenext --moduleResolution nodenext src/unrdf-hooks/index.ts
      - name: Verify JavaScript lint boundary
        run: >-
          pnpm exec eslint --max-warnings=0 src/integrations src/jobs/hooks.mjs
          src/cli/commands/hooks.mjs src/telemetry/index.mjs
          src/hooks/PredicateEvaluator.mjs src/hooks/HookOrchestrator.mjs
          src/hooks/HookParser.mjs src/workflow/step-handlers/template-step-handler.mjs
          src/composables/git.mjs src/git-native/ReceiptWriter.mjs
      - name: Verify surviving UNRDF packages
        run: |
          node --input-type=module <<'NODE'
          for (const name of ['@unrdf/core', '@unrdf/hooks', '@unrdf/kgc-4d', '@unrdf/kgn', '@unrdf/validation']) {
            await import(name);
            console.log(`ADMITTED ${name}`);
          }
          NODE
      - name: Verify workflow-engine direct dependency closure
        run: node --input-type=module -e "await import('./src/workflow/workflow-engine.mjs'); console.log('WORKFLOW_ENGINE_IMPORT_ALIVE')"
      - name: Verify OpenTelemetry compatibility
        run: |
          node --input-type=module <<'NODE'
          const { GitVanTelemetry } = await import('./src/telemetry/index.mjs');
          const telemetry = new GitVanTelemetry({ enableAutoInstrumentation: false, exportToFile: false });
          await telemetry.initialize();
          telemetry.recordCommand('fortune5-smoke', 1, true);
          await telemetry.shutdown();
          console.log('TELEMETRY_ALIVE');
          NODE
      - name: Verify Excel output compatibility
        run: |
          node --input-type=module <<'NODE'
          import { stat, rm } from 'node:fs/promises';
          import { OutputStepHandler } from './src/workflow/step-handlers/output-step-handler.mjs';
          const path = '/tmp/gitvan-enterprise-output.xlsx';
          const handler = new OutputStepHandler({ logger: { info() {}, warn() {}, error() {} } });
          await handler._generateExcel({ name: 'GitVan', status: 'ALIVE' }, {}, path);
          const info = await stat(path);
          if (info.size <= 0) throw new Error('Excel output is empty');
          await rm(path);
          console.log('EXCEL_ALIVE');
          NODE
      - name: Verify focused hooks behavior, consequence, and receipts
        run: pnpm exec vitest run tests/knowledge-hooks-simple-verification.test.mjs tests/knowledge-hooks-system.test.mjs --reporter=verbose
      - name: Verify enterprise authority boundary
        run: pnpm test:enterprise
      - name: Verify active documentation contract
        run: pnpm test:docs
      - name: Full regression suite
        run: pnpm test
      - name: Build package
        run: pnpm build
      - name: Verify formatted repair
        run: >-
          pnpm exec prettier --check package.json pnpm-workspace.yaml
          src/telemetry/index.mjs src/unrdf-hooks/core/state.ts
          src/unrdf-hooks/events/hooks.ts src/unrdf-hooks/examples/advanced-patterns.ts
          src/unrdf-hooks/repository/hooks.ts .github/workflows/hooks-build.yml
          src/hooks/PredicateEvaluator.mjs src/hooks/HookOrchestrator.mjs
          src/hooks/HookParser.mjs src/workflow/step-handlers/template-step-handler.mjs
