name: One-shot Fortune-5 push closure

on:
  push:
    branches:
      - agent/fortune5-enterprise-hardening-20260812
    paths:
      - '.github/workflows/one-shot-fortune5-push.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'seanchatmangpt'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact pushed subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin pnpm toolchain
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.21.0
          test "$(pnpm --version)" = '11.21.0'
      - name: Apply exact repair encoded by closure v6
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/one-shot-fortune5-closure-v2.yml')
          lines = workflow.read_text().splitlines()
          opener = "          python3 - <<'PY'"
          closer = "          PY"
          try:
              start = lines.index(opener) + 1
              end = lines.index(closer, start)
          except ValueError as error:
              raise SystemExit(f'closure repair payload not found: {error}')

          payload = []
          for line in lines[start:end]:
              if line == '':
                  payload.append('')
              elif line.startswith('          '):
                  payload.append(line[10:])
              else:
                  raise SystemExit(f'unexpected closure payload indentation: {line!r}')

          source = '\n'.join(payload) + '\n'
          exec(compile(source, str(workflow), 'exec'), {})
          PY
      - name: Manufacture base lock
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Manufacture patched transitive overrides from audit
        run: pnpm audit --fix=override --prod
      - name: Reconcile generated overrides into canonical lock
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Format manufactured projection
        run: >-
          pnpm exec prettier --write package.json pnpm-workspace.yaml
          src/telemetry/index.mjs src/unrdf-hooks/core/state.ts
          src/unrdf-hooks/events/hooks.ts src/unrdf-hooks/examples/advanced-patterns.ts
          src/unrdf-hooks/repository/hooks.ts .github/workflows/hooks-build.yml
          src/hooks/PredicateEvaluator.mjs src/hooks/HookOrchestrator.mjs
          src/hooks/HookParser.mjs src/workflow/step-handlers/template-step-handler.mjs
          src/composables/git.mjs src/git-native/ReceiptWriter.mjs
          tests/knowledge-hooks-simple-verification.test.mjs
          tests/knowledge-hooks-system.test.mjs
      - name: Replay frozen graph
        run: pnpm install --frozen-lockfile
      - name: Refuse HIGH or CRITICAL production advisories
        run: pnpm audit --prod --audit-level high
      - name: Verify exact direct dependency identities
        run: |
          test "$(node -p 'require("./package.json").dependencies["@opentelemetry/sdk-node"]')" = '0.221.0'
          test "$(node -p 'require("./package.json").dependencies.n3')" = '2.2.0'
          test "$(node -p 'require("./package.json").devDependencies["@types/node"]')" = '22.20.1'
          test "$(node -p 'require("./package.json").devDependencies.unbuild')" = '3.6.1'
      - name: Verify strict hooks type boundary
        run: >-
          pnpm exec tsc --noEmit --skipLibCheck --strict --allowJs false
          --target esnext --module nodenext --moduleResolution nodenext src/unrdf-hooks/index.ts
      - name: Verify JavaScript lint boundary
        run: >-
          pnpm exec eslint --max-warnings=0 src/integrations src/jobs/hooks.mjs
          src/cli/commands/hooks.mjs src/telemetry/index.mjs
          src/hooks/PredicateEvaluator.mjs src/hooks/HookOrchestrator.mjs
          src/hooks/HookParser.mjs src/workflow/step-handlers/template-step-handler.mjs
          src/composables/git.mjs src/git-native/ReceiptWriter.mjs
      - name: Verify surviving UNRDF packages
        run: |
          node --input-type=module <<'NODE'
          for (const name of ['@unrdf/core', '@unrdf/hooks', '@unrdf/kgc-4d', '@unrdf/kgn', '@unrdf/validation']) {
            await import(name);
            console.log(`ADMITTED ${name}`);
          }
          NODE
      - name: Verify workflow-engine direct dependency closure
        run: node --input-type=module -e "await import('./src/workflow/workflow-engine.mjs'); console.log('WORKFLOW_ENGINE_IMPORT_ALIVE')"
      - name: Verify OpenTelemetry compatibility
        run: |
          node --input-type=module <<'NODE'
          const { GitVanTelemetry } = await import('./src/telemetry/index.mjs');
          const telemetry = new GitVanTelemetry({ enableAutoInstrumentation: false, exportToFile: false });
          await telemetry.initialize();
          telemetry.recordCommand('fortune5-smoke', 1, true);
          await telemetry.shutdown();
          console.log('TELEMETRY_ALIVE');
          NODE
      - name: Verify Excel output compatibility
        run: |
          node --input-type=module <<'NODE'
          import { stat, rm } from 'node:fs/promises';
          import { OutputStepHandler } from './src/workflow/step-handlers/output-step-handler.mjs';
          const path = '/tmp/gitvan-enterprise-output.xlsx';
          const handler = new OutputStepHandler({ logger: { info() {}, warn() {}, error() {} } });
          await handler._generateExcel({ name: 'GitVan', status: 'ALIVE' }, {}, path);
          const info = await stat(path);
          if (info.size <= 0) throw new Error('Excel output is empty');
          await rm(path);
          console.log('EXCEL_ALIVE');
          NODE
      - name: Verify focused hooks behavior consequence and receipts
        run: pnpm exec vitest run tests/knowledge-hooks-simple-verification.test.mjs tests/knowledge-hooks-system.test.mjs --reporter=verbose
      - name: Verify enterprise authority boundary
        run: pnpm test:enterprise
      - name: Verify active documentation contract
        run: pnpm test:docs
      - name: Full regression suite
        run: pnpm test
      - name: Build package
        run: pnpm build
      - name: Verify formatted repair
        run: >-
          pnpm exec prettier --check package.json pnpm-workspace.yaml
          src/telemetry/index.mjs src/unrdf-hooks/core/state.ts
          src/unrdf-hooks/events/hooks.ts src/unrdf-hooks/examples/advanced-patterns.ts
          src/unrdf-hooks/repository/hooks.ts .github/workflows/hooks-build.yml
          src/hooks/PredicateEvaluator.mjs src/hooks/HookOrchestrator.mjs
          src/hooks/HookParser.mjs src/workflow/step-handlers/template-step-handler.mjs
          src/composables/git.mjs src/git-native/ReceiptWriter.mjs
          tests/knowledge-hooks-simple-verification.test.mjs
          tests/knowledge-hooks-system.test.mjs
      - name: Verify bounded mutation scope
        shell: bash
        run: |
          git diff --check
          rm -f docs-test-report.json
          mapfile -t changed < <(git status --short | awk '{print $2}')
          allowed='package.json pnpm-lock.yaml pnpm-workspace.yaml src/telemetry/index.mjs src/unrdf-hooks/core/state.ts src/unrdf-hooks/events/hooks.ts src/unrdf-hooks/examples/advanced-patterns.ts src/unrdf-hooks/repository/hooks.ts .github/workflows/hooks-build.yml src/hooks/PredicateEvaluator.mjs src/hooks/HookOrchestrator.mjs src/hooks/HookParser.mjs src/workflow/step-handlers/template-step-handler.mjs src/composables/git.mjs src/git-native/ReceiptWriter.mjs tests/knowledge-hooks-simple-verification.test.mjs tests/knowledge-hooks-system.test.mjs'
          for path in "${changed[@]}"; do
            case " $allowed " in *" $path "*) ;; *) echo "Unexpected mutation: $path" >&2; exit 1 ;; esac
          done
          test "$(node -p 'Boolean(require("./package.json").dependencies["@unrdf/knowledge-engine"])')" = 'false'
          test "$(node -p 'Boolean(require("./package.json").dependencies["@unrdf/streaming"])')" = 'false'
          test "$(node -p 'Boolean(require("./package.json").dependencies.unbuild)')" = 'false'
      - name: Commit and push verified closure repair
        run: |
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml src/telemetry/index.mjs src/unrdf-hooks/core/state.ts src/unrdf-hooks/events/hooks.ts src/unrdf-hooks/examples/advanced-patterns.ts src/unrdf-hooks/repository/hooks.ts .github/workflows/hooks-build.yml src/hooks/PredicateEvaluator.mjs src/hooks/HookOrchestrator.mjs src/hooks/HookParser.mjs src/workflow/step-handlers/template-step-handler.mjs src/composables/git.mjs src/git-native/ReceiptWriter.mjs tests/knowledge-hooks-simple-verification.test.mjs tests/knowledge-hooks-system.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'close hook consequence receipt and dependency blockers'
          git push origin HEAD:${{ github.ref_name }}
