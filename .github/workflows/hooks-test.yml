name: Hooks Integration Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'hooks/**'
      - 'src/unrdf-hooks/**'
      - 'src/integrations/**'
      - 'src/jobs/hooks.mjs'
      - 'src/cli/commands/hooks.mjs'
      - 'tests/**/*hooks*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/hooks-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hooks/**'
      - 'src/unrdf-hooks/**'
      - 'src/integrations/**'
      - 'tests/**/*hooks*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/hooks-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hooks-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  LANG: C
  NODE_ENV: test

jobs:
  hooks-test:
    name: Hooks contract (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Pin pnpm toolchain
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.21.0
          test "$(pnpm --version)" = "11.21.0"
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Unit and structure hooks tests
        run: >-
          pnpm exec vitest run
          tests/knowledge-hooks-simple-verification.test.mjs
          tests/knowledge-hooks-system.test.mjs
          tests/jtbd-hooks-structure.test.mjs
          --reporter=verbose
      - name: Git lifecycle hooks integration
        run: >-
          pnpm exec vitest run
          tests/knowledge-hooks-git-lifecycle.test.mjs
          tests/knowledge-hooks-end-to-end.test.mjs
          tests/developer-workflow-knowledge-hooks.test.mjs
          --reporter=verbose

  hooks-stress:
    name: Hooks stress contract
    runs-on: ubuntu-latest
    needs: hooks-test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin pnpm toolchain
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.21.0
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Stress tests are release-blocking when requested
        run: >-
          pnpm exec vitest run
          tests/knowledge-hooks-stress.test.mjs
          tests/knowledge-hooks-timer-stress-test.test.mjs
          --reporter=verbose
          --testTimeout=120000
