name: One-shot hooks type repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-hooks-type-repair.yml'

permissions:
  contents: read

jobs:
  repair:
    if: >-
      github.actor == 'seanchatmangpt' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fortune5-enterprise-hardening-20260812'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact admitted branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin pnpm toolchain
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.21.0
          test "$(pnpm --version)" = '11.21.0'
      - name: Apply bounded source and dependency repair
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['devDependencies']['@types/node'] = '22.20.1'
          package['dependencies'].pop('@unrdf/knowledge-engine', None)
          package['dependencies'].pop('@unrdf/streaming', None)
          package['devDependencies'] = dict(sorted(package['devDependencies'].items()))
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          replace_once(
              'src/unrdf-hooks/core/state.ts',
              "    const newValue = isFunction(setter) ? setter(this.value) : setter;\n",
              "    const newValue = typeof setter === 'function'\n      ? (setter as (prev: T) => T)(this.value)\n      : setter;\n",
          )

          replace_once(
              'src/unrdf-hooks/events/hooks.ts',
              "): AsyncGenerator<T, void, unknown> {\n",
              "): AsyncIterableIterator<T> {\n",
          )

          replace_once(
              'src/unrdf-hooks/examples/advanced-patterns.ts',
              "    return () => subscribers.delete(callback);\n",
              "    return () => {\n      subscribers.delete(callback);\n    };\n",
          )

          replace_once(
              'src/unrdf-hooks/repository/hooks.ts',
              "import { DEFAULT_REPOSITORY_STATE_OPTIONS } from './types.js';\n\nconst execFileAsync = promisify(execFile);\n",
              "import { DEFAULT_REPOSITORY_STATE_OPTIONS } from './types.js';\n\ntype MutableRemoteInfo = { -readonly [K in keyof RemoteInfo]?: RemoteInfo[K] };\ntype MutableWorktreeInfo = { -readonly [K in keyof WorktreeInfo]?: WorktreeInfo[K] };\n\nconst execFileAsync = promisify(execFile);\n",
          )
          replace_once(
              'src/unrdf-hooks/repository/hooks.ts',
              "        const remotes: Map<string, Partial<RemoteInfo>> = new Map();\n",
              "        const remotes: Map<string, MutableRemoteInfo> = new Map();\n",
          )
          replace_once(
              'src/unrdf-hooks/repository/hooks.ts',
              "        let current: Partial<WorktreeInfo> = {};\n",
              "        let current: MutableWorktreeInfo = {};\n",
          )

          hooks_build = Path('.github/workflows/hooks-build.yml')
          text = hooks_build.read_text()
          for dead in ["            '@unrdf/knowledge-engine',\n", "            '@unrdf/streaming',\n"]:
              if dead not in text:
                  raise SystemExit(f'hooks-build missing expected dependency probe: {dead.strip()}')
              text = text.replace(dead, '', 1)
          hooks_build.write_text(text)
          PY
      - name: Manufacture updated canonical lock
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Install and verify repaired closure
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit --skipLibCheck --strict --allowJs false --target esnext --module nodenext --moduleResolution nodenext src/unrdf-hooks/index.ts
          pnpm exec eslint --max-warnings=0 src/integrations src/jobs/hooks.mjs src/cli/commands/hooks.mjs
          pnpm exec prettier --check src/unrdf-hooks/core/state.ts src/unrdf-hooks/events/hooks.ts src/unrdf-hooks/examples/advanced-patterns.ts src/unrdf-hooks/repository/hooks.ts .github/workflows/hooks-build.yml package.json
          node --input-type=module <<'NODE'
          for (const name of ['@unrdf/core', '@unrdf/hooks', '@unrdf/kgc-4d', '@unrdf/kgn', '@unrdf/validation']) {
            await import(name);
            console.log(`ADMITTED ${name}`);
          }
          NODE
          pnpm exec vitest run tests/knowledge-hooks-simple-verification.test.mjs tests/knowledge-hooks-system.test.mjs --reporter=verbose
      - name: Verify mutation scope and identity
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git status --short | awk '{print $2}')
          allowed='package.json pnpm-lock.yaml src/unrdf-hooks/core/state.ts src/unrdf-hooks/events/hooks.ts src/unrdf-hooks/examples/advanced-patterns.ts src/unrdf-hooks/repository/hooks.ts .github/workflows/hooks-build.yml'
          for path in "${changed[@]}"; do
            case " $allowed " in
              *" $path "*) ;;
              *) echo "Unexpected mutation: $path" >&2; exit 1 ;;
            esac
          done
          test "$(node -p 'require("./package.json").devDependencies["@types/node"]')" = '22.20.1'
          test "$(node -p 'Boolean(require("./package.json").dependencies["@unrdf/knowledge-engine"])')" = 'false'
          test "$(node -p 'Boolean(require("./package.json").dependencies["@unrdf/streaming"])')" = 'false'
      - name: Commit and push verified repair
        run: |
          git add package.json pnpm-lock.yaml src/unrdf-hooks/core/state.ts src/unrdf-hooks/events/hooks.ts src/unrdf-hooks/examples/advanced-patterns.ts src/unrdf-hooks/repository/hooks.ts .github/workflows/hooks-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'repair strict hooks type boundary'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
