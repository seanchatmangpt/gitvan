name: Documentation Generation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
      - '.cursorrules'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  LANG: C

jobs:
  generate:
    name: Generate documentation artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin pnpm toolchain
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.21.0
          test "$(pnpm --version)" = "11.21.0"
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Validate documentation examples
        run: pnpm test:docs
      - name: Build package for CLI documentation
        run: pnpm build
      - name: Generate API documentation
        run: |
          mkdir -p docs/api
          if [ ! -f jsdoc.conf.json ]; then
            cat > /tmp/gitvan-jsdoc.json <<'EOF'
          {
            "source": {"include": ["src"], "includePattern": ".+\\.mjs$"},
            "opts": {"destination": "docs/api", "recurse": true}
          }
          EOF
            JSDOC_CONFIG=/tmp/gitvan-jsdoc.json
          else
            JSDOC_CONFIG=jsdoc.conf.json
          fi
          pnpm exec jsdoc -c "$JSDOC_CONFIG" -r src/ -d docs/api
      - name: Capture packaged CLI help
        run: |
          mkdir -p docs/cli
          node dist/bin/gitvan.mjs --help > docs/cli/help.txt
      - name: Generate coverage documentation
        run: |
          pnpm exec vitest run --coverage
          if [ -d coverage ]; then
            rm -rf docs/coverage
            mkdir -p docs/coverage
            cp -R coverage/. docs/coverage/
          fi
      - name: Upload generated documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-documentation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            docs/api/
            docs/cli/
            docs/coverage/
          if-no-files-found: error
          retention-days: 30

  build-site:
    name: Build documentation site
    runs-on: ubuntu-latest
    needs: generate
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download generated documentation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated-documentation-${{ github.event.pull_request.head.sha || github.sha }}
          path: generated/
      - name: Assemble site
        run: |
          rm -rf public
          mkdir -p public
          cp README.md public/index.md
          cp CLAUDE.md public/developer-guide.md 2>/dev/null || true
          cp -R docs/. public/
          cp -R generated/. public/
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitVan Documentation</title></head>
          <body><main><h1>GitVan Documentation</h1><ul><li><a href="index.md">README</a></li><li><a href="developer-guide.md">Developer Guide</a></li><li><a href="api/">API Reference</a></li><li><a href="coverage/">Coverage</a></li><li><a href="cli/help.txt">CLI Help</a></li></ul></main></body></html>
          EOF
      - name: Upload documentation site receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-site-${{ github.event.pull_request.head.sha || github.sha }}
          path: public/
          if-no-files-found: error
          retention-days: 90
      - name: Manufacture Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public/

  deploy-pages:
    name: Deploy documentation to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
