name: One-shot GitNativeIO liveness repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-gitnative-liveness.yml'

permissions:
  contents: read

jobs:
  repair:
    if: >-
      github.actor == 'seanchatmangpt' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fortune5-enterprise-hardening-20260812'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact admitted branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin pnpm toolchain
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.21.0
          test "$(pnpm --version)" = '11.21.0'
      - name: Install admitted dependency graph
        run: pnpm install --frozen-lockfile
      - name: Repair initialization recursion and arm closure rerun
        run: |
          python3 - <<'PY'
          from pathlib import Path

          io = Path('src/git-native/GitNativeIO.mjs')
          text = io.read_text()
          old = '''    // Reconcile state on startup
    await this.reconcile();

    this._initialized = true;
    this.logger.info("GitNativeIO initialized successfully");
'''
          new = '''    // Mark initialized before reconciliation so reconcile() cannot recursively
    // re-enter initialize() through _ensureInitialized(). Roll back on failure.
    this._initialized = true;
    try {
      await this.reconcile();
    } catch (error) {
      this._initialized = false;
      throw error;
    }

    this.logger.info("GitNativeIO initialized successfully");
'''
          if text.count(old) != 1:
              raise SystemExit(f'GitNativeIO initialization boundary drifted: {text.count(old)} matches')
          io.write_text(text.replace(old, new, 1))

          closure = Path('.github/workflows/one-shot-fortune5-closure-v2.yml')
          closure_text = closure.read_text()
          old_name = 'name: One-shot Fortune-5 closure repair v5\n'
          new_name = 'name: One-shot Fortune-5 closure repair v6\n'
          if closure_text.count(old_name) != 1:
              raise SystemExit('closure workflow identity drifted')
          closure.write_text(closure_text.replace(old_name, new_name, 1))
          PY
      - name: Format liveness repair
        run: pnpm exec prettier --write src/git-native/GitNativeIO.mjs .github/workflows/one-shot-fortune5-closure-v2.yml
      - name: Execute GitNativeIO initialization and reconciliation
        run: |
          node --input-type=module <<'NODE'
          import { mkdtemp, writeFile, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          import { GitNativeIO } from './src/git-native/GitNativeIO.mjs';

          const execFileAsync = promisify(execFile);
          const cwd = await mkdtemp(join(tmpdir(), 'gitvan-io-liveness-'));
          try {
            await execFileAsync('git', ['init'], { cwd });
            await execFileAsync('git', ['config', 'user.name', 'GitVan Liveness'], { cwd });
            await execFileAsync('git', ['config', 'user.email', 'liveness@gitvan.dev'], { cwd });
            await writeFile(join(cwd, 'README.md'), '# liveness\n');
            await execFileAsync('git', ['add', 'README.md'], { cwd });
            await execFileAsync('git', ['commit', '-m', 'liveness fixture'], { cwd });

            const logger = { info() {}, warn() {}, error() {}, debug() {} };
            const io = new GitNativeIO({ cwd, logger });
            let timer;
            const timeout = new Promise((_, reject) => {
              timer = setTimeout(() => reject(new Error('GitNativeIO initialization exceeded 5s')), 5000);
            });
            await Promise.race([io.initialize(), timeout]);
            clearTimeout(timer);
            const status = await io.getStatus();
            if (!status?.queue?.high || !status?.receipts || !status?.workers) {
              throw new Error('GitNativeIO status is incomplete after initialization');
            }
            await io.shutdown();
            console.log('GIT_NATIVE_IO_LIVENESS_ALIVE');
          } finally {
            await rm(cwd, { recursive: true, force: true });
          }
          NODE
      - name: Verify bounded mutation scope
        run: |
          git diff --check
          mapfile -t changed < <(git status --short | awk '{print $2}')
          allowed='src/git-native/GitNativeIO.mjs .github/workflows/one-shot-fortune5-closure-v2.yml'
          for path in "${changed[@]}"; do
            case " $allowed " in *" $path "*) ;; *) echo "Unexpected mutation: $path" >&2; exit 1 ;; esac
          done
      - name: Commit and push verified liveness repair
        run: |
          git add src/git-native/GitNativeIO.mjs .github/workflows/one-shot-fortune5-closure-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'repair git native initialization liveness'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
