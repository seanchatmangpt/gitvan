name: Hooks Code Linting

on:
  push:
    branches: [main, develop]
    paths:
      - 'hooks/**'
      - 'src/unrdf-hooks/**'
      - 'src/integrations/**'
      - 'src/jobs/hooks.mjs'
      - 'src/cli/commands/hooks.mjs'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/hooks-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hooks/**'
      - 'src/unrdf-hooks/**'
      - 'src/integrations/**'
      - 'src/jobs/hooks.mjs'
      - 'src/cli/commands/hooks.mjs'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/hooks-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hooks-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  LANG: C

jobs:
  validate-hooks:
    name: Validate hooks source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin pnpm toolchain
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.21.0
          test "$(pnpm --version)" = "11.21.0"
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: ESLint executable hooks surface
        shell: bash
        run: |
          mapfile -t files < <(git ls-files 'hooks/**' 'src/integrations/**' 'src/jobs/hooks.mjs' 'src/cli/commands/hooks.mjs' | grep -E '\.(js|mjs|cjs)$' || true)
          if ((${#files[@]})); then
            pnpm exec eslint --max-warnings=0 "${files[@]}"
          fi
      - name: Type-check TypeScript hooks surface
        run: >-
          pnpm exec tsc
          --noEmit
          --skipLibCheck
          --strict
          --allowJs false
          --target esnext
          --module nodenext
          --moduleResolution nodenext
          src/unrdf-hooks/index.ts
      - name: Check formatting without mutation
        shell: bash
        run: |
          mapfile -t files < <(git ls-files 'hooks/**' 'src/unrdf-hooks/**' 'src/integrations/**' 'src/jobs/hooks.mjs' 'src/cli/commands/hooks.mjs' | grep -E '\.(js|mjs|cjs|json|ts)$' || true)
          if ((${#files[@]})); then
            pnpm exec prettier --check "${files[@]}"
          fi
      - name: Refuse CommonJS require in ESM hook sources
        shell: bash
        run: |
          if grep -R --line-number --include='*.mjs' --include='*.js' 'require(' hooks src/unrdf-hooks src/integrations 2>/dev/null; then
            echo 'CommonJS require() found in ESM hook surface' >&2
            exit 1
          fi
