name: Generate Changelog

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to generate changelog for'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================================
  # Generate Changelog
  # ============================================================================
  changelog:
    name: Generate and Update Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get version from tag or input
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Generate Changelog
        id: changelog
        run: |
          echo "# Changelog" > CHANGELOG.new.md
          echo "" >> CHANGELOG.new.md
          echo "All notable changes to this project will be documented in this file." >> CHANGELOG.new.md
          echo "" >> CHANGELOG.new.md
          echo "The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/)," >> CHANGELOG.new.md
          echo "and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)." >> CHANGELOG.new.md
          echo "" >> CHANGELOG.new.md

          # Get latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            echo "## [${{ steps.version.outputs.version }}] - $(date +%Y-%m-%d)" >> CHANGELOG.new.md
            echo "" >> CHANGELOG.new.md

            # Get all commits
            git log --pretty=format:"%s" --no-merges | while read -r commit; do
              echo "- $commit" >> CHANGELOG.new.md
            done
          else
            echo "## [${{ steps.version.outputs.version }}] - $(date +%Y-%m-%d)" >> CHANGELOG.new.md
            echo "" >> CHANGELOG.new.md

            # Categorize commits
            echo "### Added" >> CHANGELOG.new.md
            git log $LATEST_TAG..HEAD --pretty=format:"%s" --no-merges | grep -iE "^(feat|add|new):" | sed 's/^[^:]*: /- /' >> CHANGELOG.new.md || echo ""
            echo "" >> CHANGELOG.new.md

            echo "### Changed" >> CHANGELOG.new.md
            git log $LATEST_TAG..HEAD --pretty=format:"%s" --no-merges | grep -iE "^(update|change|refactor|improve):" | sed 's/^[^:]*: /- /' >> CHANGELOG.new.md || echo ""
            echo "" >> CHANGELOG.new.md

            echo "### Fixed" >> CHANGELOG.new.md
            git log $LATEST_TAG..HEAD --pretty=format:"%s" --no-merges | grep -iE "^(fix|bugfix|patch):" | sed 's/^[^:]*: /- /' >> CHANGELOG.new.md || echo ""
            echo "" >> CHANGELOG.new.md

            echo "### Security" >> CHANGELOG.new.md
            git log $LATEST_TAG..HEAD --pretty=format:"%s" --no-merges | grep -iE "^(security|sec):" | sed 's/^[^:]*: /- /' >> CHANGELOG.new.md || echo ""
            echo "" >> CHANGELOG.new.md

            echo "### Documentation" >> CHANGELOG.new.md
            git log $LATEST_TAG..HEAD --pretty=format:"%s" --no-merges | grep -iE "^(docs|doc):" | sed 's/^[^:]*: /- /' >> CHANGELOG.new.md || echo ""
            echo "" >> CHANGELOG.new.md
          fi

          # Append existing changelog if it exists
          if [ -f CHANGELOG.md ]; then
            tail -n +2 CHANGELOG.md >> CHANGELOG.new.md 2>/dev/null || true
          fi

          mv CHANGELOG.new.md CHANGELOG.md

      - name: Display Changelog
        run: |
          echo "## Generated Changelog" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -50 CHANGELOG.md >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet CHANGELOG.md || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changelog
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for v${{ steps.version.outputs.version }}"
          git push
        continue-on-error: true

  # ============================================================================
  # Create Release Notes
  # ============================================================================
  release-notes:
    name: Create Release Notes
    runs-on: ubuntu-latest
    needs: changelog
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          {
            echo "## What's Changed"
            echo ""

            if [ -z "$LATEST_TAG" ]; then
              git log --pretty=format:"- %s (%h)" --no-merges
            else
              git log $LATEST_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges
            fi

            echo ""
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$LATEST_TAG...v${{ steps.version.outputs.version }}"
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
