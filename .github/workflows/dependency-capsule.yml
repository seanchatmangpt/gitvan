name: Dependency Capsule

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/dependency-capsule.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/dependency-capsule.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-capsule-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-lock:
    name: Verify canonical pnpm capsule
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Refuse competing package-manager identity
        run: |
          test ! -e package-lock.json
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'Tracked package-lock.json competes with canonical pnpm identity' >&2
            exit 1
          fi
          test "$(node -p 'require("./package.json").packageManager')" = 'pnpm@11.21.0'
          test "$(node -p 'require("./package.json").engines.node')" = '>=22.0.0'
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin pnpm toolchain
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.21.0
          test "$(pnpm --version)" = '11.21.0'
      - name: Verify lock closure without lifecycle execution
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          PROTOBUF_PACKAGE="$(find node_modules/.pnpm -path '*/node_modules/protobufjs/package.json' -print -quit)"
          test -n "$PROTOBUF_PACKAGE"
          PROTOBUF_VERSION="$(PROTOBUF_PACKAGE="$PROTOBUF_PACKAGE" node -p "JSON.parse(require('node:fs').readFileSync(process.env.PROTOBUF_PACKAGE, 'utf8')).version")"
          test "$PROTOBUF_VERSION" = '7.5.5'
          rm -rf node_modules
      - name: Replay admitted dependency lifecycle
        run: |
          pnpm install --frozen-lockfile
          pnpm list --depth Infinity --json > /tmp/dependency-tree.json
          pnpm audit --prod --audit-level high
      - name: Prove install did not mutate dependency identity
        run: |
          git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml
      - name: Bind dependency receipt
        run: |
          rm -rf /tmp/gitvan-dependency-receipt
          mkdir -p /tmp/gitvan-dependency-receipt
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml /tmp/gitvan-dependency-receipt/
          cp /tmp/dependency-tree.json /tmp/gitvan-dependency-receipt/
          sha256sum package.json pnpm-lock.yaml pnpm-workspace.yaml > /tmp/gitvan-dependency-receipt/SHA256SUMS
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > /tmp/gitvan-dependency-receipt/SOURCE_SHA
      - name: Upload dependency receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitvan-dependency-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/gitvan-dependency-receipt/
          if-no-files-found: error
          retention-days: 30
