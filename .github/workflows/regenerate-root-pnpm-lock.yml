name: Regenerate root pnpm lockfile

on:
  push:
    branches:
      - feat/kgc4d-native-event-receipts

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/kgc4d-native-event-receipts
          fetch-depth: 0

      - run: npm i -fg corepack && corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Regenerate lockfile from package.json
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit generated lockfile if changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm lockfile"
          git push origin HEAD:feat/kgc4d-native-event-receipts
