name: One-shot canonical lock materializer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-lock-materialize.yml'

permissions:
  contents: read

jobs:
  materialize:
    if: >-
      github.actor == 'seanchatmangpt' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fortune5-enterprise-hardening-20260812'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact admitted branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Prove manufacturer inputs
        run: |
          test "$(git hash-object package.json)" = "82b3a55bcbb630621aca76135f9bf16e5a2797eb"
          test "$(git hash-object pnpm-workspace.yaml)" = "4ed8cf200dd3e094d600c2c2b58854b0f00d3e87"
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin pnpm toolchain
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.21.0
          test "$(pnpm --version)" = "11.21.0"
      - name: Manufacture exact canonical lock
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          test "$(git hash-object package.json)" = "82b3a55bcbb630621aca76135f9bf16e5a2797eb"
          test "$(git hash-object pnpm-workspace.yaml)" = "4ed8cf200dd3e094d600c2c2b58854b0f00d3e87"
          test "$(git hash-object pnpm-lock.yaml)" = "7f3e91c1c16267702c85628dc298c89f542fe21f"
      - name: Remove obsolete npm lock and verify diff scope
        shell: bash
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git rm package-lock.json
          fi
          mapfile -t changed < <(git status --short | awk '{print $2}')
          for path in "${changed[@]}"; do
            case "$path" in
              pnpm-lock.yaml|package-lock.json) ;;
              *) echo "Unexpected mutation: $path" >&2; exit 1 ;;
            esac
          done
          git diff --check
      - name: Commit and push exact dependency identity
        shell: bash
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Canonical dependency graph already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'install canonical pnpm dependency graph'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
